<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Admin • Entrevistas</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,system-ui;
}

/* ================= BODY ================= */
body{
  height:100vh;
  display:flex;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:#fff;
  overflow:hidden;
}

/* ================= SIDEBAR ================= */
.sidebar{
  width:360px;
  padding:28px;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(30px);
  overflow:auto;
  animation:slideIn .6s ease;
}

@keyframes slideIn{
  from{transform:translateX(-40px);opacity:0}
  to{transform:none;opacity:1}
}

.sidebar h2{
  margin-bottom:16px;
  font-size:22px;
}

.search input{
  width:100%;
  padding:14px 16px;
  border-radius:18px;
  border:none;
  background:rgba(255,255,255,.15);
  color:#fff;
  margin-bottom:20px;
}

/* =====================================================================
   COMPONENTE: CARD DE CANDIDATO NA SIDEBAR
   ---------------------------------------------------------------------
   Este bloco representa cada candidato listado na lateral.
   Ele não executa lógica de negócio.
   Serve apenas como gatilho visual e de seleção.
   ===================================================================== */

.candidato{
  background:rgba(255,255,255,.12);
  padding:16px;
  border-radius:18px;
  margin-bottom:14px;
  cursor:pointer;
  transition:.3s;
  animation:fadeUp .4s ease;
}

.candidato:hover{
  background:rgba(255,255,255,.25);
  transform:scale(1.02);
}

.candidato strong{
  display:block;
  font-size:15px;
}

.candidato small{
  opacity:.7;
  font-size:13px;
}

.candidato label{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
  font-size:12px;
  opacity:.8;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1}
}

/* ================= MAIN ================= */
.main{
  flex:1;
  padding:36px;
  overflow:auto;
}

/* ================= MENU ================= */
.menu{
  display:flex;
  gap:18px;
  margin-bottom:32px;
}

.menu button{
  padding:16px 30px;
  border-radius:22px;
  border:none;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

.menu button.active,
.menu button:hover{
  background:#2563eb;
  transform:scale(1.05);
}

/* ================= CARDS ================= */
.card{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(25px);
  border-radius:30px;
  padding:28px;
  margin-bottom:28px;
  animation:fadeUp .5s ease;
}

/* ================= STATS ================= */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:24px;
}

.stat{
  background:rgba(255,255,255,.12);
  padding:20px;
  border-radius:20px;
}

.stat span{
  display:block;
  font-size:30px;
  font-weight:700;
  margin-top:6px;
}

/* ================= RANKING ================= */
.rank{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,.12);
  padding:18px;
  border-radius:18px;
  margin-bottom:14px;
  animation:fadeUp .4s ease;
}

/* ================= COMPARAÇÃO ================= */
.compare{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.compare .box{
  background:rgba(255,255,255,.12);
  padding:22px;
  border-radius:22px;
  animation:fadeUp .4s ease;
}

.best{
  border:2px solid #22c55e;
  box-shadow:0 0 30px rgba(34,197,94,.4);
}

/* ================= DETALHES ================= */
.detalhes{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(25px);
  border-radius:30px;
  padding:28px;
  animation:fadeUp .5s ease;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.grid div{
  background:rgba(255,255,255,.12);
  padding:16px;
  border-radius:16px;
  font-size:14px;
}

.acoes{
  display:flex;
  gap:16px;
  margin-top:24px;
  flex-wrap:wrap;
}

.acoes button{
  padding:16px 26px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-weight:600;
  transition:.3s;
}

.aprovar{background:#16a34a}
.rejeitar{background:#dc2626}

/* ================= NOVO ================= */
.resetar{
  background:#f59e0b;
}

.pdf{background:#2563eb}

.acoes button:hover{
  transform:scale(1.08);
}

/* ================= GRAPH ================= */
canvas{
  max-width:320px;
  margin:auto;
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
<h2>👥 Candidatos</h2>
<div class="search">
<input id="busca" placeholder="Buscar nome ou CPF">
</div>
<div id="lista"></div>
</div>

<!-- ================= MAIN ================= -->
<div class="main">

<div class="menu">
<button class="active" onclick="abrirAba('painel',this)">📋 Painel</button>
<button onclick="abrirAba('ranking',this)">🏆 Classificação</button>
<button onclick="abrirAba('comparacao',this)">🆚 Comparação</button>
</div>

<div id="painel" class="card"></div>
<div id="ranking" class="card" style="display:none"></div>
<div id="comparacao" class="card" style="display:none"></div>
<div id="detalhes" class="detalhes" style="display:none"></div>

</div>
<!-- ================= MAIN SCRIPT ================= -->
<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ================= CONFIGURAÇÃO FIREBASE ================= */
const app = initializeApp({
 apiKey:"AIzaSyBdKHo1V9wGola1aXwugmbHSGWPmWoKwq8",
 authDomain:"entrevista-site.firebaseapp.com",
 projectId:"entrevista-site"
});
const db = getFirestore(app);

/* ================= STATE ================= */
let candidatos = [];
let atual = null;
let selecionados = [];
let aba = "painel";

/* ================= SCORE IA ================= */
const scoreIA = c => {
 let s = 50;
 if (c.motivo?.length > 60) s += 20;
 if (c.salario <= 6000) s += 10;
 if (c.cargo_desejado?.toLowerCase().includes("dev")) s += 20;
 return Math.min(100, s);
};

/* ================= LOAD ================= */
const snap = await getDocs(query(collection(db,"entrevistas"),orderBy("criado_em","desc")));
snap.forEach(d => {
 const c = d.data();
 c.id = d.id;
 c.score = scoreIA(c);
 candidatos.push(c);
});

/* ================= RENDER LISTA ================= */
function renderLista(f="") {
 lista.innerHTML = "";
 candidatos
  .filter(c => (`${c.nome_completo}${c.cpf}`).toLowerCase().includes(f))
  .forEach(c => {
   const div = document.createElement("div");
   div.className = "candidato";

   div.innerHTML = `
     <label>
       <input type="checkbox" onclick="event.stopPropagation()" onchange="toggleSelect('${c.id}',this)">
       Comparar
     </label>
     <strong>${c.nome_completo}</strong>
     <small>${c.cargo_desejado}</small>
   `;

   div.onclick = () => abrirDetalhes(c);
   lista.appendChild(div);
  });
}
busca.oninput = e => renderLista(e.target.value.toLowerCase());

/* ================= PAINEL ================= */
function renderPainel() {
 let n = 0, a = 0, r = 0;
 candidatos.forEach(c => {
  if(c.status === "novo") n++;
  if(c.status === "aprovado") a++;
  if(c.status === "rejeitado") r++;
 });

 painel.innerHTML = `
 <div class="stats">
  <div class="stat">Total<span>${candidatos.length}</span></div>
  <div class="stat">Novos<span>${n}</span></div>
  <div class="stat">Aprovados<span>${a}</span></div>
  <div class="stat">Rejeitados<span>${r}</span></div>
 </div>
 <canvas id="grafico" height="160"></canvas>
 `;

 new Chart(grafico,{
  type:"doughnut",
  data:{labels:["Novo","Aprovado","Rejeitado"],datasets:[{data:[n,a,r]}]}
 });
}

/* ================= RANKING ================= */
function renderRanking() {
 ranking.innerHTML = "<h3>🏆 Classificação</h3>";
 [...candidatos]
  .sort((a,b)=>b.score-a.score)
  .forEach((c,i)=>{
   ranking.innerHTML += `
    <div class="rank">
     <span>${["🥇","🥈","🥉"][i]||"⭐"} ${c.nome_completo}</span>
     <b>${c.score}</b>
    </div>
   `;
  });
}

/* ================= COMPARAÇÃO ================= */
function renderComparacao() {
 comparacao.innerHTML = "<h3>🆚 Comparação</h3>";

 if(selecionados.length !== 2){
  comparacao.innerHTML += "<p>Selecione 2 candidatos</p>";
  return;
 }

 const [a,b] = selecionados.map(id => candidatos.find(c => c.id === id));
 const melhor = a.score > b.score ? a : b;

 [a,b].forEach(c=>{
  comparacao.innerHTML += `
   <div class="box ${c===melhor?'best':''}">
    <h4>${c.nome_completo}</h4>
    <p>${c.cargo_desejado}</p>
    <p>💰 R$ ${Number(c.salario ?? 0).toLocaleString('pt-BR')}</p>
    <p>⭐ Score ${c.score}</p>
   </div>
  `;
 });
}

/* ================= SELECT ================= */
window.toggleSelect = (id, chk) => {
 if(chk.checked){
  if(selecionados.length >= 2){ chk.checked = false; return }
  selecionados.push(id);
 } else {
  selecionados = selecionados.filter(i => i !== id);
 }
 if(aba === "comparacao") renderComparacao();
};

/* ================= DETALHES ================= */
function abrirDetalhes(c) {
 abaFechar();
 atual = c;
 detalhes.style.display = "block";
 detalhes.innerHTML = `
 <h3>👤 ${c.nome_completo}</h3>
 <div class="grid">
  <div>CPF: ${c.cpf}</div>
  <div>Email: ${c.email}</div>
  <div>Telefone: ${c.telefone}</div>
  <div>Cargo: ${c.cargo_desejado}</div>
  <div>Salário: R$ ${c.salario !== undefined ? Number(c.salario).toLocaleString('pt-BR') : 'Não informado'}</div>
  <div>Status: ${c.status}</div>
  <div style="grid-column:span 2">Motivo: ${c.motivo}</div>
 </div>
 <div class="acoes">
  <button class="aprovar" onclick="confirmarStatus('aprovado')">Aprovar</button>
  <button class="rejeitar" onclick="confirmarStatus('rejeitado')">Rejeitar</button>
  <button class="resetar" onclick="confirmarStatus('novo')">Resetar</button>
  <button class="pdf" onclick="exportar()">PDF</button>
 </div>
 `;
}

/* ================= MENU ================= */
window.abrirAba = (t, btn) => {
 aba = t;
 document.querySelectorAll(".menu button").forEach(b => b.classList.remove("active"));
 btn.classList.add("active");
 painel.style.display = t === "painel" ? "block" : "none";
 ranking.style.display = t === "ranking" ? "block" : "none";
 comparacao.style.display = t === "comparacao" ? "block" : "none";
 detalhes.style.display = "none";

 if(t === "ranking") renderRanking();
 if(t === "comparacao") renderComparacao();
};

function abaFechar() {
 painel.style.display = "none";
 ranking.style.display = "none";
 comparacao.style.display = "none";
}

/* ================= STATUS ================= */
// ================= NOVO =================
window.confirmarStatus = async (s) => {
 if(!confirm(`Confirma alteração do status para "${s}"?`)) return;
 if(!atual) return;
 await updateDoc(doc(db,"entrevistas",atual.id),{status:s});
 location.reload();
};

/* ================= PDF ================= */
window.exportar = () => {
 const { jsPDF } = window.jspdf;
 const p = new jsPDF();
 let y = 10;
 Object.entries(atual).forEach(([k,v])=>{
  if(typeof v === "object") return;
  p.text(`${k}: ${v}`,10,y); y+=8;
 });
 p.save("entrevista.pdf");
};

/* ================= INITIAL RENDER ================= */
renderLista();
renderPainel();
</script>

console.log("[UI] Sistema de comparação pronto");

/* ================= UI/UX - BOTÃO RESETAR ================= */

console.log("[INFO] Botão Resetar disponível nos detalhes");

/* ================= LOGS DE INTERAÇÃO ================= */
// Clique em Aprovar/Rejeitar/Resetar
window.addEventListener("click", e => {
 if(e.target.classList.contains("aprovar")) console.log(`[ACTION] Aprovar clicado para ${atual?.nome_completo}`);
 if(e.target.classList.contains("rejeitar")) console.log(`[ACTION] Rejeitar clicado para ${atual?.nome_completo}`);
 if(e.target.classList.contains("resetar")) console.log(`[ACTION] Resetar clicado para ${atual?.nome_completo}`);
});

window.addEventListener("change", e => {
 if(e.target.type === "checkbox") console.log(`[ACTION] Checkbox toggled: ${e.target.checked}`);

busca.addEventListener("input", e => console.log(`[SEARCH] Buscando: ${e.target.value}`));

/* ================= UI/UX - PDF ================= */

console.log("[INFO] Sistema de exportação PDF pronto");
