<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <style>
    body{background:#000428;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Inter}
    .box{background:#111;padding:40px;border-radius:20px;width:320px}
    input,button{width:100%;padding:14px;margin-top:10px;border-radius:10px;border:none}
    button{background:#0a84ff;color:#fff;font-weight:600}
  </style>
</head>
<body>
<div class="box">
  <h2>Admin</h2>
  <input id="email" placeholder="Email">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdKHo1V9wGola1aXwugmbHSGWPmWoKwq8",
    authDomain: "entrevista-site.firebaseapp.com",
    projectId: "entrevista-site",
    storageBucket: "entrevista-site.firebasestorage.app",
    messagingSenderId: "672692445481",
    appId: "1:672692445481:web:e93d808971b029448c9738"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.login = async ()=>{
    await signInWithEmailAndPassword(auth,email.value,senha.value);
    location.href="index.html";
  }
</script>
</body>
</html>
